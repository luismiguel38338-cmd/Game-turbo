name: Android CI - Game Turbo AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify project integrity via gameturbo-admin
        run: |
          chmod +x gameturbo-admin/gameturbo-admin gameturbo-admin/scripts/*.sh
          ./gameturbo-admin/gameturbo-admin verify

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify Debug APK & SHA-256
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          sha256sum "$APK_PATH" | tee debug-apk.sha256

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-turbo-ai-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            debug-apk.sha256

      - name: Build Signed Release APK (when keystore secrets are configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release-upload.jks
          export KEYSTORE_PATH="$(pwd)/release-upload.jks"
          gradle :app:assembleRelease --stacktrace
          APK_REL="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_REL"
          sha256sum "$APK_REL" | tee release-apk.sha256
          rm -f release-upload.jks
